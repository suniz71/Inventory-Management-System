server:
  port: 9091

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/leave_db?createDatabaseIfNotExist=true&useSSL=false
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.example.com
    port: 587
    username: your-email@example.com
    password: your-email-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
